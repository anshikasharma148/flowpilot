# Render Blueprint: one free web service that serves the UI and the API.
services:
  - type: web
    name: flowpilot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY      # optional: leave empty to run in rule-based mode
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.5-flash
      - key: TIMEZONE
        value: Asia/Kolkata
      # Email: Brevo HTTPS API (hosts often block outgoing SMTP)
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OPS_TEAM_EMAIL
        sync: false
      # Jira Cloud
      - key: JIRA_URL
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: JIRA_PROJECT_KEY
        sync: false
